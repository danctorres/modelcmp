name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  # The Rust the README and Cargo.toml promise still builds it.
  msrv:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check --locked
  # Daily: fails when an upstream (models.dev, Epoch AI) changes format and the data thins
  # out, before a user sees it. Floors sit at about two thirds of the 1329 models, 210 with
  # ECI, 135 with a coding score, 1256 priced and 27 with a task cost of 2026-10-08.
  data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo run --locked --quiet -- list --all --json --refresh > models.json
      - run: |
          jq '{models: length, eci: map(select(.eci)) | length, coding: map(select(.tasks.coding)) | length,
               priced: map(select(.price.input_per_mtok)) | length,
               task_cost: map(select(.task_cost_usd)) | length}' models.json | tee counts.json
          jq -e '.models >= 900 and .eci >= 140 and .coding >= 90 and .priced >= 850 and .task_cost >= 15' counts.json
  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo.toml version
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary runs and is this version
        run: test "$(target/${{ matrix.target }}/release/modelcmp --version)" = "modelcmp ${GITHUB_REF_NAME#v}"
      - run: |
          name="modelcmp-${{ matrix.target }}-$GITHUB_REF_NAME"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/modelcmp" README.md KEYS.md REFERENCE.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
  # Fills pkg/modelcmp.rb from SHA256SUMS and pushes it to the tap. Needs the
  # HOMEBREW_TAP_TOKEN secret (contents: write on danctorres/homebrew-tap).
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" -p SHA256SUMS
          mkdir out
          pkg/render.sh "$VERSION" SHA256SUMS pkg/modelcmp.rb > out/modelcmp.rb
      - uses: actions/checkout@v7
        with:
          repository: danctorres/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push Homebrew formula
        run: |
          mkdir -p tap/Formula
          cp out/modelcmp.rb tap/Formula/
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/modelcmp.rb
          git diff --cached --quiet && exit  # re-run of the same release
          git commit -m "feat: update modelcmp to ${VERSION#v}"
          git push
